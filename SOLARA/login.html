<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLARA — Login</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-frame">
    <section class="auth-wrap">
      <div class="auth-head">
        <div class="s-label">Client Access</div>
        <h1>Welcome Back</h1>
        <p class="auth-sub">Enter your credentials to continue exploring and booking exclusive luxury cars.</p>
      </div>
      <form id="loginForm" class="auth-form" onsubmit="loginUser(event)">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" name="email" type="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" name="password" type="password" placeholder="Enter your password" required>
        </div>
        <div class="auth-submit">
          <button type="submit">Login</button>
        </div>
        <div id="authMsg" class="auth-message"></div>
      </form>
      <p class="auth-footer">Don't have an account? <a href="register.html">Create one</a></p>
      <p class="auth-footer"><a href="solara.html">Back to homepage</a></p>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
