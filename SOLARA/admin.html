<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLARA — Admin</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <main class="admin-frame">
    <section class="admin-wrap">
      <div class="admin-head">
        <div class="s-label">Inventory Upload</div>
        <h1>Admin Dashboard</h1>
        <p class="admin-sub">Add new vehicles directly to the SOLARA fleet database. Images are uploaded with the car details.</p>
      </div>
      <form id="carCreateForm" class="admin-form" onsubmit="createCar(event)">
        <div class="form-row">
          <div class="form-group">
            <label for="brand">Brand</label>
            <input id="brand" name="brand" type="text" placeholder="Example: Lamborghini" required>
          </div>
          <div class="form-group">
            <label for="model">Model</label>
            <input id="model" name="model" type="text" placeholder="Example: Aventador" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="sports">Sports</option>
              <option value="hypercar">Hypercar</option>
              <option value="sedan">Sedan</option>
              <option value="suv">SUV</option>
              <option value="convertible">Convertible</option>
            </select>
          </div>
          <div class="form-group">
            <label for="status">Inventory Status</label>
            <select id="status" name="status" required>
              <option value="available">Available / Left</option>
              <option value="rented">On Rent</option>
              <option value="sold">Sold / Bought</option>
              <option value="maintenance">Maintenance</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="price">Sale Price (INR)</label>
            <input id="price" name="price" type="number" placeholder="e.g. 25000000" required>
          </div>
          <div class="form-group">
            <label for="rentalPrice">Rental Price / day (INR)</label>
            <input id="rentalPrice" name="rentalPrice" type="number" placeholder="e.g. 25000" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="year">Year</label>
            <input id="year" name="year" type="number" placeholder="2025" required>
          </div>
          <div class="form-group">
            <label for="color">Color</label>
            <input id="color" name="color" type="text" placeholder="Carbon Black" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="acceleration">Acceleration</label>
            <input id="acceleration" name="acceleration" type="text" placeholder="0-100 km/h" required>
          </div>
          <div class="form-group">
            <label for="maxSpeed">Top Speed</label>
            <input id="maxSpeed" name="maxSpeed" type="text" placeholder="e.g. 350 km/h" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="power">Power</label>
            <input id="power" name="power" type="text" placeholder="e.g. 770 hp" required>
          </div>
          <div class="form-group">
            <label for="fuel">Fuel</label>
            <input id="fuel" name="fuel" type="text" placeholder="Petrol / Hybrid" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="seats">Seats</label>
            <input id="seats" name="seats" type="number" placeholder="2" required>
          </div>
          <div class="form-group">
            <label for="rating">Rating</label>
            <input id="rating" name="rating" type="number" step="0.1" min="0" max="5" placeholder="4.8" required>
          </div>
        </div>
        <div class="form-group">
          <label for="reviews">Review Count</label>
          <input id="reviews" name="reviews" type="number" placeholder="120" required>
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" placeholder="Short details shown to customers"></textarea>
        </div>
        <div class="form-group">
          <label for="image">Car Image</label>
          <input id="image" name="image" type="file" accept="image/*" required>
        </div>
        <div class="form-actions admin-actions">
          <button type="submit" class="btn-g">Add Vehicle</button>
          <a class="admin-back" href="solara.html">← Return to homepage</a>
        </div>
        <div id="adminMsg" class="admin-notice"></div>
      </form>
      <section class="admin-panel">
        <div class="admin-panel-head">
          <div>
            <div class="s-label">Database Overview</div>
            <h2>Inventory, Orders and Clients</h2>
          </div>
          <button class="btn-o" type="button" onclick="loadAdminDashboard()">Refresh</button>
        </div>
        <div id="adminStats" class="admin-stats"></div>
        <h3>Car Inventory</h3>
        <div id="adminCars" class="admin-table"></div>
        <h3>Orders</h3>
        <div id="adminOrders" class="admin-table"></div>
        <h3>Registered Users</h3>
        <div id="adminUsers" class="admin-table"></div>
      </section>
    </section>
  </main>
  <script src="js/admin.js"></script>
</body>
</html>
