<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLARA — Sign Up</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-frame">
    <section class="auth-wrap">
      <div class="auth-head">
        <div class="s-label">Create Account</div>
        <h1>Join SOLARA</h1>
        <p class="auth-sub">Register quickly and gain access to our curated luxury car collection.</p>
      </div>
      <form id="signupForm" class="auth-form" onsubmit="signupUser(event)">
        <div class="form-group">
          <label for="signupName">Full Name</label>
          <input id="signupName" name="name" type="text" placeholder="Your full name" required>
        </div>
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input id="signupEmail" name="email" type="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="signupPhone">Phone</label>
          <input id="signupPhone" name="phone" type="tel" placeholder="+91 98765 43210">
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input id="signupPassword" name="password" type="password" placeholder="Create a password" required>
        </div>
        <div class="auth-submit">
          <button type="submit">Sign Up</button>
        </div>
        <div id="authMsg" class="auth-message"></div>
      </form>
      <p class="auth-footer">Already registered? <a href="login.html">Login here</a></p>
      <p class="auth-footer"><a href="solara.html">Back to homepage</a></p>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
