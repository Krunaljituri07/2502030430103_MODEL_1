<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royal Cart — Royal Feast</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<canvas id="particles-canvas"></canvas>
<div class="toast-container-royal"></div>
<button class="scroll-top-btn"><i class="fas fa-chevron-up"></i></button>

<nav class="navbar navbar-expand-lg royal-navbar scrolled">
  <div class="container-fluid px-4">
    <a class="navbar-brand-royal" href="index.html"><i class="fas fa-crown me-2" style="font-size:1rem;"></i>Royal Feast</a>
    <div class="ms-auto d-flex align-items-center gap-3">
      <a href="index.html" style="font-family:var(--font-heading);font-size:0.75rem;letter-spacing:0.1em;color:var(--silver);text-decoration:none;text-transform:uppercase;">
        <i class="fas fa-arrow-left me-1"></i> Continue Shopping
      </a>
    </div>
  </div>
</nav>

<section class="cart-section">
  <div class="container">
    <div class="page-hero" style="min-height:auto;margin-top:0;padding:2rem 0 3rem;">
      <div>
        <div class="ornament justify-content-center">
          <div class="ornament-line"></div>
          <i class="fas fa-shopping-cart" style="color:var(--gold)"></i>
          <div class="ornament-line right"></div>
        </div>
        <h1 class="section-title">Your Royal Cart</h1>
        <p class="section-subtitle mb-0">Review your royal selections before checkout</p>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-8">
        <div id="cart-items-container">
          <!-- Populated by JS -->
          <div class="text-center py-5">
            <i class="fas fa-spinner fa-spin" style="font-size:2rem;color:var(--gold);"></i>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="cart-summary">
          <h4 style="font-family:var(--font-heading);color:var(--gold);letter-spacing:0.1em;font-size:0.95rem;text-transform:uppercase;margin-bottom:1.5rem;border-bottom:1px solid var(--glass-border);padding-bottom:1rem;">
            <i class="fas fa-receipt me-2"></i>Order Summary
          </h4>
          <div class="cart-total-line">
            <span>Subtotal</span><span id="subtotal">₹0</span>
          </div>
          <div class="cart-total-line">
            <span>Royal Delivery</span><span id="delivery-fee">Free</span>
          </div>
          <div class="cart-total-line">
            <span>GST (5%)</span><span id="tax-amt">₹0</span>
          </div>
          <div class="cart-total-line grand">
            <span><i class="fas fa-crown me-1"></i> Grand Total</span>
            <span id="grand-total">₹0</span>
          </div>

          <button class="btn-royal-gold w-100 mt-3" id="checkout-btn">
            <i class="fas fa-crown me-2"></i>Place Royal Order
          </button>
          <a href="index.html" class="btn-royal-outline w-100 mt-2 text-center d-block">
            Continue Shopping
          </a>

          <div class="mt-3 text-center" style="font-family:var(--font-heading);font-size:0.68rem;letter-spacing:0.1em;color:var(--silver);text-transform:uppercase;">
            <i class="fas fa-shield-alt text-gold me-1"></i> Secure Royal Checkout
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="royal-footer" style="padding-top:2rem;">
  <div class="footer-bottom container">
    <span style="color:var(--gold);">© 2024 Royal Feast</span> &nbsp;·&nbsp; All Rights Reserved
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="main.js"></script>
</body>
</html>
