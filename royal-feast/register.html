<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Royal Feast</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<canvas id="particles-canvas"></canvas>
<div class="toast-container-royal"></div>

<nav class="navbar royal-navbar navbar-expand-lg scrolled">
  <div class="container-fluid px-4">
    <a class="navbar-brand-royal" href="index.html"><i class="fas fa-crown me-2" style="font-size:1rem;"></i>Royal Feast</a>
  </div>
</nav>

<section class="auth-section" style="padding-top:6rem;padding-bottom:3rem;">
  <div class="auth-card" style="max-width:560px;">
    <div class="auth-logo"><i class="fas fa-crown me-2"></i>Royal Feast</div>
    <h2 class="auth-title">Join the Royal Court</h2>
    <p style="font-family:var(--font-body);color:var(--silver);text-align:center;font-style:italic;margin-bottom:2rem;font-size:0.95rem;">Create your royal account and dine like a monarch</p>

    <form id="register-form" novalidate>
      <!-- Username -->
      <div class="mb-3">
        <label class="royal-label"><i class="fas fa-user me-1"></i> Username</label>
        <input type="text" id="reg-username" class="form-control royal-input" placeholder="Choose a royal username (min. 3 chars)" />
        <div class="validation-msg" id="reg-username-msg"></div>
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label class="royal-label"><i class="fas fa-envelope me-1"></i> Royal Email</label>
        <input type="email" id="reg-email" class="form-control royal-input" placeholder="your@email.com" />
        <div class="validation-msg" id="reg-email-msg"></div>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="royal-label"><i class="fas fa-lock me-1"></i> Password</label>
        <div class="position-relative">
          <input type="password" id="reg-password" class="form-control royal-input" placeholder="Create a strong passphrase" />
          <button type="button" class="btn position-absolute end-0 top-50 translate-middle-y" id="toggleRegPass" style="background:none;border:none;color:var(--silver);padding:0.5rem 0.75rem;z-index:5;">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="password-strength mt-2">
          <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
          <span class="strength-text" id="strength-text"></span>
        </div>
        <div class="validation-msg" id="reg-pass-msg"></div>
        <div style="font-family:var(--font-heading);font-size:0.66rem;color:var(--silver);letter-spacing:0.06em;margin-top:0.25rem;">
          Requires: uppercase • number • special char • 8+ characters
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="mb-3">
        <label class="royal-label"><i class="fas fa-lock me-1"></i> Confirm Password</label>
        <input type="password" id="reg-confirm-password" class="form-control royal-input" placeholder="Repeat your passphrase" />
        <div class="validation-msg" id="reg-confirm-msg"></div>
      </div>

      <!-- Date of Birth -->
      <div class="mb-3">
        <label class="royal-label"><i class="fas fa-calendar me-1"></i> Date of Birth</label>
        <input type="date" id="reg-dob" class="form-control royal-input" max="" />
        <div class="validation-msg" id="reg-dob-msg"></div>
      </div>

      <!-- PDF Upload -->
      <div class="mb-4">
        <label class="royal-label"><i class="fas fa-file-pdf me-1"></i> Identity Document (PDF Only)</label>
        <div class="upload-zone" id="upload-zone">
          <input type="file" id="reg-pdf" accept=".pdf" style="display:none;" />
          <i class="fas fa-file-upload d-block"></i>
          <div class="upload-text mt-1" id="upload-zone-text">Click or drag & drop your PDF here</div>
          <div style="font-family:var(--font-heading);font-size:0.65rem;color:var(--silver);letter-spacing:0.08em;margin-top:0.4rem;text-transform:uppercase;">
            PDF files only · JPG/PNG rejected
          </div>
        </div>
        <div class="validation-msg" id="reg-pdf-msg"></div>
      </div>

      <button type="submit" class="btn-royal-gold w-100 mb-3">
        <i class="fas fa-crown me-2"></i>Join the Royal Court
      </button>
    </form>

    <div class="auth-divider"><span>already a member</span></div>

    <div class="text-center" style="font-family:var(--font-body);color:var(--silver);font-size:0.95rem;">
      <a href="login.html" style="color:var(--gold);text-decoration:none;">Sign In to Your Royal Account</a>
    </div>

    <div class="text-center mt-3">
      <a href="index.html" style="font-family:var(--font-heading);font-size:0.72rem;letter-spacing:0.1em;color:var(--silver);text-decoration:none;text-transform:uppercase;">
        <i class="fas fa-arrow-left me-1"></i> Return to Homepage
      </a>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="main.js"></script>
<script>
  // Set max date for DOB (today)
  document.getElementById('reg-dob').max = new Date().toISOString().split('T')[0];

  $('#toggleRegPass').on('click', function() {
    const inp = $('#reg-password');
    const type = inp.attr('type') === 'password' ? 'text' : 'password';
    inp.attr('type', type);
    $(this).find('i').toggleClass('fa-eye fa-eye-slash');
  });
</script>
</body>
</html>
