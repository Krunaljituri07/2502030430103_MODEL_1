<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Royal Feast</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<canvas id="particles-canvas"></canvas>
<div class="toast-container-royal"></div>

<nav class="navbar royal-navbar navbar-expand-lg scrolled">
  <div class="container-fluid px-4">
    <a class="navbar-brand-royal" href="index.html"><i class="fas fa-crown me-2" style="font-size:1rem;"></i>Royal Feast</a>
  </div>
</nav>

<section class="auth-section">
  <div class="auth-card">
    <div class="auth-logo"><i class="fas fa-crown me-2"></i>Royal Feast</div>
    <h2 class="auth-title">Welcome Back, Your Highness</h2>
    <p style="font-family:var(--font-body);color:var(--silver);text-align:center;font-style:italic;margin-bottom:2rem;font-size:0.95rem;">Enter your royal credentials to access your court</p>

    <form id="login-form" novalidate>
      <div class="mb-3">
        <label class="royal-label" for="login-username"><i class="fas fa-user me-1"></i> Username</label>
        <input type="text" id="login-username" class="form-control royal-input" placeholder="Enter your royal username" autocomplete="username" />
        <div class="validation-msg" id="username-msg"></div>
      </div>

      <div class="mb-4">
        <label class="royal-label" for="login-password"><i class="fas fa-lock me-1"></i> Password</label>
        <div class="position-relative">
          <input type="password" id="login-password" class="form-control royal-input" placeholder="Enter your secret passphrase" autocomplete="current-password" />
          <button type="button" class="btn position-absolute end-0 top-50 translate-middle-y" id="togglePass" style="background:none;border:none;color:var(--silver);padding:0.5rem 0.75rem;z-index:5;">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="validation-msg" id="password-msg"></div>
        <div style="font-family:var(--font-heading);font-size:0.68rem;color:var(--silver);letter-spacing:0.08em;margin-top:0.3rem;">
          Must have: uppercase, number, special char & 8+ characters
        </div>
      </div>

      <button type="submit" class="btn-royal-gold w-100 mb-3">
        <i class="fas fa-sign-in-alt me-2"></i>Enter the Palace
      </button>
    </form>

    <div class="auth-divider"><span>or</span></div>

    <div class="text-center" style="font-family:var(--font-body);color:var(--silver);font-size:0.95rem;">
      New to the kingdom? <a href="register.html" style="color:var(--gold);text-decoration:none;">Join Royal Feast</a>
    </div>

    <div class="text-center mt-3">
      <a href="index.html" style="font-family:var(--font-heading);font-size:0.72rem;letter-spacing:0.1em;color:var(--silver);text-decoration:none;text-transform:uppercase;">
        <i class="fas fa-arrow-left me-1"></i> Return to Homepage
      </a>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="main.js"></script>
<script>
  $('#togglePass').on('click', function() {
    const inp = $('#login-password');
    const type = inp.attr('type') === 'password' ? 'text' : 'password';
    inp.attr('type', type);
    $(this).find('i').toggleClass('fa-eye fa-eye-slash');
  });
</script>
</body>
</html>
